[project]
name = "my-rag-center"
version = "0.1.0"
description = "A small, extensible RAG platform backend."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.15,<2.0",
    "celery[redis]>=5.4.0,<6.0",
    "elasticsearch[async]>=8.17,<9.0",
    "fastapi>=0.115,<1.0",
    "langfuse>=2.0.0,<3.0.0",
    "mammoth>=1.6.0",
    "openai>=1.68,<2.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.0,<7.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "datasets>=2.0.0",
    # RAGAS imports VertexAI from this compatibility path during startup.
    "langchain-community<0.4.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
